<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <td>학년 선택</td>
            <td>
                <select>
                    <option>1학년</option>
                    <option>2학년</option>
                    <option>3학년</option>
                    <option>4학년</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>점심 메뉴 선택</td>
            <td>
                <label><input type="radio" name="lunch" value="짜장면">짜장면</label>
                <label><input type="radio" name="lunch" value="짬뽕">짬뽕</label>
                <label><input type="radio" name="lunch" value="볶음밥">볶음밥</label>
            </td>
        </tr>

        <tr>
            <td>선호하는 음식</td>
            <td>
                <label><input type="checkbox" name="food" value="짜장면">짜장면</label>
                <label><input type="checkbox" name="food" value="짬뽕">짬뽕</label>
                <label><input type="checkbox" name="food" value="탕수육">탕수육</label>
            </td>
        </tr>

        <tr>
            <td>자기소개서</td>
            <td><textarea placeholder="자기소개서를 작성해주세요."></textarea></td>
        </tr>

        <tr>
            <td colspan="2">
                <button type="submit">제출</button>
                <button type="reset">리셋</button>
            </td>
        </tr>       
</body>
</html>
